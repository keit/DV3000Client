# Builds the .deb and AppImage for x86_64 and aarch64 (Raspberry Pi),
# installs/runs them on clean Debian and Ubuntu images,
# and -- for a pushed vX.Y.Z or vX.Y.Z-rc.N tag -- uploads them to a
# *draft* GitHub release (a pre-release for an -rc tag)
# along with SHA256SUMS and a source tarball that includes the submodules
# (GitHub's own "Source code" archives leave them out, and the GPL needs
# the complete source of what's in the binaries).
#
# Run it by hand (Actions > Release > Run workflow) to get the packages as
# workflow artifacts without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            deb-arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64 # Raspberry Pi 3 and later on a 64-bit OS
            deb-arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Debian 12 (bookworm), the oldest release the packages support -- also
    # what Raspberry Pi OS Bookworm is built on. Binaries only run on a
    # glibc and Qt at least as new as what they were built against.
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates curl file \
            libasound2-dev qt6-base-dev qmake6 qt6-wayland

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # A tag must be vX.Y.Z (matching project() in CMakeLists.txt) or
      # vX.Y.Z-rc.N, a release candidate of it.
      - name: Check the tag and work out the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^project(dv3000client VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if ! [[ $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(rc\.[0-9]+))?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          if [ "${BASH_REMATCH[1]}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match project() version $version in CMakeLists.txt"
            exit 1
          fi
          echo "PRERELEASE=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
        shell: bash

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DDV3K_PRERELEASE="${PRERELEASE:-}"
          cmake --build build -j"$(nproc)"

      # An RC's Debian version has a "~" (0.1.0~rc.1), which GitHub would
      # rewrite in an asset's file name -- breaking SHA256SUMS -- so name
      # the file with a "-" instead; apt goes by the version inside.
      - name: Package .deb
        run: |
          cd build && cpack -G DEB
          for f in dv3kclient_*~*.deb; do [ -e "$f" ] && mv "$f" "${f//\~/-}"; done
          ls dv3kclient_*.deb
        shell: bash

      # The .deb's Depends are hand-written (see CMakeLists.txt); make sure
      # they still name every package dpkg-shlibdeps says the binary needs,
      # at a minimum version at least as high as it says.
      - name: Check the .deb Depends cover the binary's libraries
        run: |
          mkdir -p /tmp/shlibdeps/debian && touch /tmp/shlibdeps/debian/control
          generated=$(cd /tmp/shlibdeps && dpkg-shlibdeps -O "$GITHUB_WORKSPACE/build/dv3kclient")
          generated=${generated#shlibs:Depends=}
          echo "dpkg-shlibdeps: $generated"
          declared=$(dpkg-deb -f build/dv3kclient_*.deb Depends | tr ',|' '\n\n' | sed 's/^ *//')
          failed=0
          IFS=',' read -ra entries <<< "$generated"
          for entry in "${entries[@]}"; do
            pkg=$(sed 's/(.*//; s/ //g' <<< "$entry")
            need=$(sed -n 's/.*(>= *\([^)]*\)).*/\1/p' <<< "$entry")
            line=$(grep "^$pkg\( \|$\)" <<< "$declared" | head -1)
            have=$(sed -n 's/.*(>= *\([^)]*\)).*/\1/p' <<< "$line")
            if [ -z "$line" ]; then
              echo "::error::$pkg is missing from CPACK_DEBIAN_PACKAGE_DEPENDS"; failed=1
            elif [ -n "$need" ] && { [ -z "$have" ] || ! dpkg --compare-versions "$have" ge "$need"; }; then
              echo "::error::CPACK_DEBIAN_PACKAGE_DEPENDS has $pkg (>= ${have:-any}), the binary needs >= $need"; failed=1
            fi
          done
          exit $failed
        shell: bash

      - name: Package AppImage
        run: ./scripts/build-appimage.sh build

      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: build/DV3KClient-${{ matrix.arch }}.AppImage --version

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: |
            build/dv3kclient_*_${{ matrix.deb-arch }}.deb
            build/DV3KClient-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # Installs each .deb with apt on clean images of every release it's meant
  # to support, so a dependency that only resolves on the build image shows
  # up here rather than on a user's machine.
  test-deb:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, deb-arch: amd64, runner: ubuntu-24.04, image: 'debian:bookworm' }
          - { arch: x86_64, deb-arch: amd64, runner: ubuntu-24.04, image: 'debian:trixie' }
          - { arch: x86_64, deb-arch: amd64, runner: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { arch: x86_64, deb-arch: amd64, runner: ubuntu-24.04, image: 'ubuntu:26.04' }
          - { arch: aarch64, deb-arch: arm64, runner: ubuntu-24.04-arm, image: 'debian:bookworm' }
          - { arch: aarch64, deb-arch: arm64, runner: ubuntu-24.04-arm, image: 'debian:trixie' }
          - { arch: aarch64, deb-arch: arm64, runner: ubuntu-24.04-arm, image: 'ubuntu:24.04' }
    name: test-deb (${{ matrix.deb-arch }}, ${{ matrix.image }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.arch }}
      - name: Install and run
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dv3kclient_*_${{ matrix.deb-arch }}.deb
          dv3kclient --version
      - name: Lintian (informational)
        continue-on-error: true
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lintian
          lintian --info dv3kclient_*_${{ matrix.deb-arch }}.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Source tarball (with submodules)
        run: |
          name=dv3kclient-${GITHUB_REF_NAME#v}
          git ls-files --recurse-submodules -z \
            | tar --null -T - --transform "s,^,$name/," -czf "dist/$name.tar.gz"

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "DV3K Client ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md \
            --generate-notes \
            $([[ $GITHUB_REF_NAME == *-rc.* ]] && echo --prerelease)
        shell: bash
